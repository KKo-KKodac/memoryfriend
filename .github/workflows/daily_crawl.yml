name: Daily WorldMemory Price Crawler

on:
  schedule:
    # UTC 기준 00:00 = KST(한국시간) 오전 09:00
    - cron: '0 0 * * *'
  workflow_dispatch: # 필요시 깃허브 웹 페이지에서 직접 수동 실행 가능

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v3

      - name: 파이썬 3.10 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 라이브러리 설치
        run: |
          pip install requests beautifulsoup4

      - name: 크롤링 스크립트 실행
        run: |
          python crawler.py

      - name: 수집 데이터(prices.json) 자동 저장 및 Commit/Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "Chore: 월드메모리 매입 시세 자동 업데이트 [오전 9시]" || exit 0
          git push
